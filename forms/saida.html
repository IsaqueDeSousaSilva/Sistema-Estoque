<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registro de Saída</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>Registro de Saída de Estoque</h1>
</header>

<nav>
    <a href="../index.html">Início</a>
    <a href="produto.html">Produto</a>
    <a href="fornecedor.html">Fornecedor</a>
    <a href="entrada.html">Entrada</a>
    <a href="saida.html">Saída</a>
    <a href="cliente.html">Cliente</a>
</nav>

<main>
    <form id="formSaida">
        <label>Produto:</label>
        <input type="text" id="produto" required>

        <label>Quantidade:</label>
        <input type="number" id="quantidade" min="1" required>

        <label>Data da Saída:</label>
        <input type="date" id="data" required>

        <label>Cliente:</label>
        <input type="text" id="cliente" required>

        <label>Motivo:</label>
        <select id="motivo" required>
            <option value="">Selecione...</option>
            <option value="Venda">Venda</option>
            <option value="Perda">Perda</option>
            <option value="Devolução">Devolução</option>
            <option value="Transferência">Transferência</option>
        </select>

        <label>Observação:</label>
        <input type="text" id="observacao">

        <button type="button" onclick="enviarSaida()">Registrar Saída</button>
    </form>

    <p id="mensagem"></p>
</main>

<footer>
    <p>Sistema de Controle de Estoque &copy; 2026</p>
</footer>

<script src="../js/saida.js"></script>
</body>
</html>
